<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CPL Chat</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="chat-layout">
  <main class="wrap wrap-chat">
    <div class="topbar">
      <div class="crumbs">
        <a href="/">← Home</a>
        <span style="color: var(--muted2); margin: 0 6px;">/</span>
        <span style="color: var(--text);">Chat</span>
      </div>
      <div class="status" id="statusPill" title="App status">
        <span class="dot" aria-hidden="true"></span>
        <span id="statusText">Ready</span>
      </div>
    </div>

    <section class="grid">
      <section class="card" aria-label="Chat input">
        <h1>CPL Chat</h1>
        <p class="sub">Please start by entering your NAME and NU-ID</p>

        <div style="display: flex; justify-content: space-between; align-items: center; margin: 10px 0 8px;">
          <label for="msg" style="margin: 0;">Your prompt</label>
          <button id="clear" class="smallbtn" type="button" style="margin: 0; padding: 4px 10px;">Clear</button>
        </div>
        
        <textarea id="msg" placeholder="Ask something... (Shift+Enter for newline)"></textarea>
        
        <div class="hint" style="margin-top: 8px; text-align: right;">Tip: Press <b>Ctrl/⌘ + Enter</b> to send</div>

        <div class="actions">
          <div class="btnrow">
            <input type="file" id="fileUpload" accept=".txt,.csv,.md,.pdf" style="display: none;" />
            <button id="attachBtn" class="smallbtn" type="button" title="Upload files">📎 Attach</button>

            <button id="send" class="primary">Send</button>
            <button id="submitApp" class="primary" style="background: var(--secondary); border-color: var(--secondary);" type="button">✉️ Submit to Advisor</button>
          </div>
        </div>
        
        <div id="filePreview" style="font-size: 13px; color: var(--accent2); margin-top: 12px; font-weight: 500;"></div>
      </section>

      <section class="card" aria-label="Chat response">
        <div class="panelTitle">
          <h2>Response History</h2>
          <button id="copy" class="smallbtn" type="button">Copy All</button>
        </div>
        <div id="chatHistory" class="chat-history">
          <div class="msg-bubble msg-system">Session started. Your conversation history will appear here.</div>
        </div>
      </section>
    </section>
  </main>

  <script src="/static/chat.js?v=5.0"></script>
</body>
</html>
