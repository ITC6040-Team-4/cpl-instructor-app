<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CPL Chat</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="chat-layout">
  <main class="wrap wrap-chat">
    <div class="topbar">
      <div class="crumbs">
        <a href="/">← Home</a>
        <span style="color: var(--muted2); margin: 0 6px;">/</span>
        <span style="color: var(--text);">Chat</span>
      </div>
      <div class="status" id="statusPill" title="App status">
        <span class="dot" aria-hidden="true"></span>
        <span id="statusText">Ready</span>
      </div>
    </div>

    <section class="grid">
      <section class="card" aria-label="Chat input">
        <h1>CPL Chat Demo</h1>
        <p class="sub">Type a prompt and call Azure OpenAI through the Web App.</p>

        <label for="msg">Your prompt</label>
        <textarea id="msg" placeholder="Ask something... (Shift+Enter for newline)"></textarea>

        <div class="actions">
          <div class="btnrow">
            <button id="send" class="primary">Send</button>
            <button id="clear" class="smallbtn" type="button">Clear</button>
          </div>
          <div class="hint">Tip: Press <b>Ctrl/⌘ + Enter</b> to send</div>
        </div>
      </section>

      <section class="card" aria-label="Chat response">
        <div class="panelTitle">
          <h2>Response</h2>
          <button id="copy" class="smallbtn" type="button">Copy</button>
        </div>
        <pre id="out">Your answer will show up here…</pre>
      </section>
    </section>
  </main>

  <script src="/static/chat.js"></script>
  <script>
    // Moved specific UI logic here that doesn't belong in chat.js
    const msgEl = document.getElementById("msg");
    const outEl = document.getElementById("out");
    const sendBtn = document.getElementById("send");
    const clearBtn = document.getElementById("clear");
    const copyBtn = document.getElementById("copy");
    const statusText = document.getElementById("statusText");

    function setStatus(text) { statusText.textContent = text; }
    function setBusy(isBusy) {
      sendBtn.disabled = isBusy;
      msgEl.disabled = isBusy;
      copyBtn.disabled = isBusy;
      clearBtn.disabled = isBusy;
      setStatus(isBusy ? "Thinking..." : "Ready");
    }

    // Attach to existing sendMessage logic from chat.js if needed or handle UI state
    document.getElementById("send").addEventListener("click", () => setBusy(true));
    
    // Quick keybind logic
    msgEl.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        sendBtn.click();
      }
    });

    clearBtn.addEventListener("click", () => {
      msgEl.value = "";
      outEl.textContent = "Your answer will show up here…";
      outEl.classList.remove("error");
      msgEl.focus();
    });

    copyBtn.addEventListener("click", async () => {
      const text = outEl.textContent || "";
      try {
        await navigator.clipboard.writeText(text);
        const old = copyBtn.textContent;
        copyBtn.textContent = "Copied!";
        setTimeout(() => (copyBtn.textContent = old), 900);
      } catch {
        const range = document.createRange();
        range.selectNodeContents(outEl);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        copyBtn.textContent = "Select & Copy";
        setTimeout(() => (copyBtn.textContent = "Copy"), 1100);
      }
    });
  </script>
</body>
</html>
