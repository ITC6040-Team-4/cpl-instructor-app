<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assessor Sign-in — Provenance</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="wrap wrap-admin">
    <section class="card" style="max-width:420px;margin:0 auto;">
      <h1>Assessor sign-in</h1>
      <p class="sub">Faculty and assessors only. Learners don't need to sign in —
        <a href="/chat">start a portfolio</a> instead.</p>
      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" />
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>
      <div id="loginError" class="error" role="alert" style="min-height:18px;"></div>
      <button id="loginBtn" class="primary" style="width:100%;border-color:var(--accent);background:var(--accent);color:#fff;">Sign in</button>
      <p class="hint" style="margin-top:14px;"><a href="/">← Back home</a></p>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    async function login() {
      $("loginError").textContent = "";
      $("loginBtn").disabled = true;
      try {
        const res = await fetch("/api/reviewer/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: $("email").value.trim(), password: $("password").value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Sign-in failed");
        location.href = "/reviewer";
      } catch (e) {
        $("loginError").textContent = e.message;
        $("loginBtn").disabled = false;
      }
    }
    $("loginBtn").addEventListener("click", login);
    [$("email"), $("password")].forEach((el) =>
      el.addEventListener("keydown", (e) => { if (e.key === "Enter") login(); }));
  </script>
</body>
</html>
