<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team 4 - CPL Application</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="wrap wrap-index">
    <section class="card" role="region" aria-label="App status and links">
      <header>
        <div>
          <h1>Team 4 CPL App</h1>
          <p class="sub">
            <span class="dot"></span>
            Running successfully — pick a page to continue.
          </p>
        </div>
        <div class="pill">Status: OK</div>
      </header>

      <ul class="links">
        <li>
          <a href="/chat" aria-label="Open Chat demo">
            <div class="label">
              <strong>Chat demo</strong>
              <span>/chat</span>
            </div>
            <span class="arrow">→</span>
          </a>
        </li>
        <li>
          <a href="/admin" aria-label="Open Admin and Config status">
            <div class="label">
              <strong>Admin / Config</strong>
              <span>/admin</span>
            </div>
            <span class="arrow">→</span>
          </a>
        </li>
        <li>
          <a href="/health" aria-label="Open Health endpoint">
            <div class="label">
              <strong>Health</strong>
              <span>/health</span>
            </div>
            <span class="arrow">→</span>
          </a>
        </li>
      </ul>

      <footer style="margin-top: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px;">
        <span>© Team 4</span>
      </footer>
    </section>
  </main>
</body>
</html>
