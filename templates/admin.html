<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Admin Status.</title>
 
<style>
:root{
  --bg:#0b1220;
  --card:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.12);
  --text:rgba(255,255,255,0.92);
  --muted:rgba(255,255,255,0.65);
  --accent:#7c5cff;
  --accent2:#28d7a5;
}
 
*{box-sizing:border-box;}
 
body{
  margin:0;
  min-height:100vh;
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  color:var(--text);
 
  background:
    radial-gradient(800px 400px at 20% 10%, rgba(124,92,255,0.35), transparent 60%),
    radial-gradient(700px 420px at 90% 20%, rgba(40,215,165,0.25), transparent 55%),
    radial-gradient(900px 500px at 50% 110%, rgba(255,255,255,0.08), transparent 60%),
    var(--bg);
 
  display:grid;
  place-items:center;
  padding:24px;
}
 
.wrap{
  width:100%;
  max-width:720px;
}
 
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:26px;
  backdrop-filter:blur(10px);
  box-shadow:0 18px 50px rgba(0,0,0,0.45);
}
 
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
 
h1{
  margin:0;
  font-size:26px;
}
 
.status-pill{
  font-size:12px;
  padding:8px 10px;
  border-radius:999px;
  border:1px solid var(--border);
  color:var(--muted);
}
 
.list{
  list-style:none;
  padding:0;
  margin:18px 0 0;
  display:grid;
  gap:10px;
}
 
.item{
  padding:12px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.04);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
 
.key{
  font-weight:600;
  font-size:14px;
}
 
.value{
  font-size:13px;
  color:var(--muted);
}
 
footer{
  margin-top:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
 
a{
  text-decoration:none;
  color:var(--text);
  border:1px solid var(--border);
  padding:8px 12px;
  border-radius:10px;
  font-size:13px;
}
 
a:hover{
  background:rgba(255,255,255,0.08);
}
 
.dot{
  width:10px;
  height:10px;
  border-radius:999px;
  background:var(--accent2);
  display:inline-block;
  margin-right:8px;
}
 
</style>
</head>
 
<body>
 
<main class="wrap">
 
<section class="card">
 
<header>
<h1>Admin / Configuration Status</h1>
<div class="status-pill">
<span class="dot"></span>System OK
</div>
</header>
 
<ul class="list">
  {% for k,v in status.items() %}
<li class="item">
<span class="key">{{k}}</span>
<span class="value">{{v}}</span>
</li>
  {% endfor %}
</ul>
 
<footer>
<span style="color:var(--muted); font-size:12px;">CPL Admin Panel</span>
<a href="/">← Back</a>
</footer>
 
</section>
 
</main>
 
</body>
</html>
