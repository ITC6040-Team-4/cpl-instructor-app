<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin Status</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="wrap wrap-admin">
    <section class="card">
      <header>
        <h1>Admin / Configuration Status</h1>
        <div class="status-pill">
          <span class="dot"></span>System OK
        </div>
      </header>

      <ul class="list">
        {% for k,v in status.items() %}
        <li class="item">
          <span class="key">{{k}}</span>
          <span class="value">{{v}}</span>
        </li>
        {% endfor %}
      </ul>

      <footer class="admin-footer">
        <span style="color:var(--muted); font-size:12px;">CPL Admin Panel</span>
        <a href="/">← Back</a>
      </footer>
    </section>
  </main>
</body>
</html>
